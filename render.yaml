# render.yaml — Render Blueprint for DriverOS
# Deploys both the Django backend (Web Service) and React/Vite frontend (Static Site)

services:
  # ─────────────────────────────────────────────
  # 1. Django REST API  (Web Service)
  # ─────────────────────────────────────────────
  - type: web
    name: driveros-backend
    runtime: python
    rootDir: backend
    buildCommand: "./build.sh"
    startCommand: "gunicorn config.wsgi:application --bind 0.0.0.0:$PORT --workers 2 --timeout 120"
    plan: free
    envVars:
      - key: DEBUG
        value: "False"
      - key: SECRET_KEY
        generateValue: true
      - key: ALLOWED_HOSTS
        value: ".onrender.com"
      - key: DATABASE_URL
        fromDatabase:
          name: driveros-db
          property: connectionString
      - key: CORS_ALLOWED_ORIGINS
        value: "https://driveros-frontend.onrender.com"
      - key: GEMINI_API_KEY
        sync: false          # Set this manually in Render dashboard
      - key: PYTHON_VERSION
        value: "3.11.0"

  # ─────────────────────────────────────────────
  # 2. React / Vite Frontend  (Static Site)
  # ─────────────────────────────────────────────
  - type: web
    name: driveros-frontend
    runtime: static
    rootDir: frontend
    buildCommand: "npm install && npm run build"
    staticPublishPath: dist
    plan: free
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_BASE_URL
        value: "https://driveros-backend.onrender.com/api/v1/"
      - key: NODE_VERSION
        value: "20"

# ─────────────────────────────────────────────
# 3. PostgreSQL Database
# ─────────────────────────────────────────────
databases:
  - name: driveros-db
    plan: free
    databaseName: driveros
    user: driveros_user
