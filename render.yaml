services:
  - type: web
    name: driveros-backend
    runtime: docker
    dockerContext: backend
    plan: free
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: driveros-db
          property: connectionString
      - key: SECRET_KEY
        generate: true
      - key: DEBUG
        value: "False"
      - key: ALLOWED_HOSTS
        value: "driveros-backend.onrender.com"
      - key: CORS_ALLOWED_ORIGINS
        value: "https://<YOUR_VERCEL_FRONTEND_URL>"
    buildCommand: ./build.sh
    startCommand: gunicorn config.wsgi:application --bind 0.0.0.0:$PORT

databases:
  - name: driveros-db
    plan: free
    databaseName: driveros
    user: driveros_user
